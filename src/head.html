<style>
:root {
  /* Layout: top bar with the cabinet switch, a left rail of modules, a working canvas of panels.
     Lists read like catalogue cards (hairline rows), not a wall of identical rounded cards. */
  --paper: #F1F3F7;
  --surface: #FFFFFF;
  --surface-2: #F6F7FA;
  --ink: #111A2E;
  --ink-2: #48526A;
  --ink-3: #687188;
  --line: #E0E4EC;
  --line-2: #C9D0DC;
  --accent: #2F45B5;
  --accent-hover: #24399E;
  --accent-ink: #FFFFFF;
  --accent-soft: #E9EDFA;
  --brass: #8E620E;
  --brass-soft: #F5ECD9;
  --spark: #F4C65A;
  --ok: #1B7A47; --ok-soft: #E2F3E9;
  --warn: #9E5600; --warn-soft: #FCEFDC;
  --info: #1667B7; --info-soft: #E3EEF9;
  --danger: #B3322A; --danger-soft: #FAE6E4;
  --overlay: rgba(17, 26, 46, .42);
  --shadow-1: 0 1px 2px rgba(17, 26, 46, .06);
  --shadow-2: 0 12px 32px rgba(17, 26, 46, .16), 0 2px 6px rgba(17, 26, 46, .06);
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Golos Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --r: 12px; --r-sm: 8px;
  --topbar-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C111C; --surface: #131A28; --surface-2: #182133;
    --ink: #E7ECF5; --ink-2: #B4BED1; --ink-3: #8E99AF;
    --line: #253049; --line-2: #34415E;
    --accent: #8FA4FF; --accent-hover: #A9B8FF; --accent-ink: #0C111C; --accent-soft: #1C2647;
    --brass: #DDB466; --brass-soft: #2C2416; --spark: #5A3E0A;
    --ok: #5CC98B; --ok-soft: #13301F; --warn: #F0A646; --warn-soft: #33250F;
    --info: #6CB2F5; --info-soft: #132A42; --danger: #F07A70; --danger-soft: #3A1714;
    --overlay: rgba(0, 0, 0, .6);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 14px 34px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C111C; --surface: #131A28; --surface-2: #182133;
  --ink: #E7ECF5; --ink-2: #B4BED1; --ink-3: #8E99AF;
  --line: #253049; --line-2: #34415E;
  --accent: #8FA4FF; --accent-hover: #A9B8FF; --accent-ink: #0C111C; --accent-soft: #1C2647;
  --brass: #DDB466; --brass-soft: #2C2416; --spark: #5A3E0A;
  --ok: #5CC98B; --ok-soft: #13301F; --warn: #F0A646; --warn-soft: #33250F;
  --info: #6CB2F5; --info-soft: #132A42; --danger: #F07A70; --danger-soft: #3A1714;
  --overlay: rgba(0, 0, 0, .6);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 14px 34px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 14.5px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: .9em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.mono { font-family: var(--font-mono); font-size: .92em; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 256px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100%; }
.topbar {
  grid-column: 1 / -1; position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
  display: flex; align-items: center; gap: 14px; padding: 0 18px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; border: 0; background: none; padding: 4px; margin-left: -4px; cursor: pointer; text-align: left; border-radius: 10px; }
.brand:hover { background: var(--surface-2); }
.brand-mark { width: 36px; height: 36px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.15; white-space: nowrap; }
.brand-name .ver { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--brass); margin-left: 2px; }
.brand-sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.demo-flag { font: 600 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--brass); background: var(--brass-soft); border-radius: 4px; padding: 4px 6px; margin-left: 4px; }
.grow { flex: 1; min-width: 0; }
.role-switch { display: inline-flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; gap: 2px; }
.role-switch button {
  display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent;
  padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 13.5px; color: var(--ink-2); white-space: nowrap;
}
.role-switch button:hover { color: var(--ink); }
.role-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-1); }
.role-switch svg.i { width: 16px; height: 16px; }
.lbl-short { display: none; }
.note-hint .note-text { flex: 1; min-width: 0; }
.panel.clip { overflow: hidden; }
.road-grid { margin: -1px -1px -1px 0; }
.top-right { display: flex; align-items: center; gap: 8px; }
.theme-switch { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; flex: none; }
.theme-switch button { display: inline-grid; place-items: center; width: 30px; height: 28px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-3); cursor: pointer; }
.theme-switch button:hover { color: var(--ink); }
.theme-switch button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-1); }
.theme-switch svg.i { width: 16px; height: 16px; }
.lang-switch { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; flex: none; }
.lang-switch button { height: 28px; min-width: 38px; padding: 0 8px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-3); cursor: pointer; font: 600 11.5px/1 var(--font-body); letter-spacing: .04em; }
.lang-switch button:hover { color: var(--ink); }
.lang-switch button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-1); }
.sys-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--surface); white-space: nowrap; cursor: default; }
.sys-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.sys-chip.on .dot { background: var(--ok); }
.sys-chip.wait .dot { background: var(--warn); }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.count { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font: 600 11px/18px var(--font-body); text-align: center; border: 2px solid var(--surface); box-sizing: content-box; }
.who { display: flex; align-items: center; gap: 9px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12.5px; background: var(--brass-soft); color: var(--brass); flex: none; }
.avatar.staff { background: var(--accent-soft); color: var(--accent); }
.who-name { font-size: 13px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.who-role { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.bell-wrap { position: relative; }

.nav {
  position: sticky; top: var(--topbar-h); align-self: start; max-height: calc(100vh - var(--topbar-h)); overflow-y: auto;
  padding: 16px 12px; border-right: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; gap: 2px; min-height: calc(100vh - var(--topbar-h));
}
.nav-title { font: 600 11px/1 var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px 8px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 8px 10px; border-radius: 9px; cursor: pointer; color: var(--ink-2); font-size: 14px; text-decoration: none;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-item[aria-current="page"] .ni-ru { font-weight: 600; }
.ni-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.ni-en { font: 400 10.5px/1.3 var(--font-mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item[aria-current="page"] .ni-en { color: inherit; opacity: .75; }
.ni-badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font: 600 11.5px/20px var(--font-body); text-align: center; }
.nav-sep { height: 1px; background: var(--line); margin: 10px 6px; }
.nav-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.nav-foot .nav-item { font-size: 13px; padding: 7px 10px; }

.main { min-width: 0; padding: 26px 32px 72px; }
.page { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
.eyebrow { font: 500 12px/1 var(--font-mono); color: var(--brass); letter-spacing: .02em; margin-bottom: 9px; display: flex; gap: 8px; align-items: center; }
.page-head h1 { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.15; letter-spacing: -.01em; }
.lede { color: var(--ink-2); max-width: 70ch; margin-top: 7px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px;
  border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1.2;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.ai { border-color: transparent; color: var(--brass); background: var(--brass-soft); }
.btn.ai:hover { filter: brightness(.97); }
.btn.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.btn.danger { color: var(--danger); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; gap: 6px; }
.btn.xs { min-height: 26px; padding: 0 8px; font-size: 12px; border-radius: 6px; gap: 5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg.i { width: 16px; height: 16px; }
.btn.sm svg.i, .btn.xs svg.i { width: 14px; height: 14px; }
.btn.is-on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; text-align: left; }
.link-btn:hover { text-decoration: underline; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.input, .select, .textarea {
  width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px;
  padding: 8px 11px; font-size: 14px; line-height: 1.45; min-height: 38px;
}
.select { padding-right: 30px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.textarea { resize: vertical; min-height: 92px; }
.input:focus, .select:focus, .textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 30%, transparent); outline-offset: 0; border-color: var(--accent); }
.input.mono { font-size: 13.5px; }
.hint { font-size: 12px; color: var(--ink-3); }
.hint.err { color: var(--danger); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.check input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); border-right: 1px solid var(--line); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); text-align: left; }
.chip-btn:hover { border-color: var(--accent); color: var(--accent); }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- Panels & layout ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-head h2 { font-size: 15.5px; font-weight: 600; line-height: 1.3; }
.panel-head .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.panel-body { padding: 16px 18px; }
.panel-body.flush { padding: 0; }
.panel-body.stack { display: flex; flex-direction: column; gap: 14px; }
.panel-foot { padding: 12px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.split.left-fixed { grid-template-columns: 430px minmax(0, 1fr); }
.split.half { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.row-list > * + * { border-top: 1px solid var(--line); }
.empty { padding: 26px 18px; text-align: center; color: var(--ink-3); font-size: 13.5px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.note.brass { background: var(--brass-soft); border-color: transparent; color: var(--ink); }
.note.brass svg.i { color: var(--brass); }
.note svg.i { width: 16px; height: 16px; margin-top: 2px; }
.divider { height: 1px; background: var(--line); }

/* ---------- Pills & tags ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.waiting { color: var(--warn); background: var(--warn-soft); }
.pill.progress { color: var(--info); background: var(--info-soft); }
.pill.resolved, .pill.approved { color: var(--ok); background: var(--ok-soft); }
.pill.draft { color: var(--ink-2); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.pill.ai { color: var(--brass); background: var(--brass-soft); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); white-space: nowrap; line-height: 1.7; }
.tag.accent { background: var(--accent-soft); box-shadow: none; color: var(--accent); }
.tag.brass { background: var(--brass-soft); box-shadow: none; color: var(--brass); }
.tag.ok { background: var(--ok-soft); box-shadow: none; color: var(--ok); }
.tag.mono { font-family: var(--font-mono); font-size: 11px; }
.tag svg.i { width: 13px; height: 13px; }
.tag { max-width: 100%; }
.chips .tag, .pp-v .tag { white-space: normal; }

/* ---------- Passport ---------- */
.passport { position: relative; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.passport-top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 20px;
  border-bottom: 1px solid var(--line);
  background-color: var(--surface-2);
  background-image: repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 1px, transparent 1px 8px);
}
.pp-label { font: 600 11.5px/1 var(--font-mono); letter-spacing: .16em; color: var(--accent); }
.pp-num { font: 500 12px/1 var(--font-mono); color: var(--ink-3); }
.passport-main { display: flex; gap: 16px; padding: 18px 20px 8px; align-items: flex-start; position: relative; }
.pp-photo { width: 66px; height: 80px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 600 23px/1 var(--font-display); flex: none; }
.pp-name { font: 600 22px/1.2 var(--font-display); padding-right: 78px; }
.pp-sub { padding-right: 78px; }
.pp-sub { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }
.stamp { position: absolute; right: 14px; top: 8px; width: 82px; height: 82px; transform: rotate(-14deg); color: var(--brass); opacity: .8; pointer-events: none; }
.pp-fields { padding: 4px 20px 16px; }
.pp-row { display: grid; grid-template-columns: 138px minmax(0, 1fr) 30px; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start; }
.pp-k { font-size: 12.5px; color: var(--ink-3); padding-top: 1px; }
.pp-v { font-size: 14px; overflow-wrap: anywhere; }
.pp-v ul { margin: 0; padding-left: 16px; }
.pp-v li + li { margin-top: 3px; }
.pp-vis { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; width: 30px; height: 26px; border-radius: 6px; display: grid; place-items: center; }
.pp-vis:hover { background: var(--surface-2); color: var(--ink); }
.pp-vis.off { color: var(--danger); }
.pp-row.is-hidden .pp-v { opacity: .45; }
.pp-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }

/* ---------- Catalogue results ---------- */
.result { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 16px; padding: 16px 18px; }
.r-year { font: 600 18px/1 var(--font-mono); }
.r-type { font: 500 10px/1.35 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: 7px; }
.r-title { font: 600 16px/1.38 var(--font-display); }
.r-title a { color: var(--ink); }
.r-title a:hover { color: var(--accent); }
.r-authors { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.r-src { font-size: 13px; color: var(--ink-3); }
.r-src i { font-style: italic; }
.r-note { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; max-width: 78ch; }
.r-badges, .r-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; align-items: center; }
.cite-box { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

/* ---------- Code box ---------- */
.codebox { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; font: 12.5px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto; margin: 0; }
.codebox.tall { max-height: 420px; }

/* ---------- Concept builder ---------- */
.concept { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.concept-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.concept-head b { font: 600 12px/1 var(--font-mono); color: var(--accent); letter-spacing: .04em; }
.term { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 9px; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); font: 12.5px/1.6 var(--font-mono); }
.term button { border: 0; background: transparent; cursor: pointer; color: var(--ink-3); width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; padding: 0; }
.term button:hover { background: var(--danger-soft); color: var(--danger); }
.term button svg.i { width: 12px; height: 12px; }
.and-sep { text-align: center; font: 600 11px/1 var(--font-mono); color: var(--ink-3); letter-spacing: .1em; }

/* ---------- Chat ---------- */
.chat { display: flex; flex-direction: column; height: min(76vh, 780px); min-height: 520px; }
.chat-log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; gap: 10px; max-width: 100%; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-radius: 14px 14px 4px 14px; padding: 9px 13px; max-width: 78%; white-space: pre-wrap; overflow-wrap: anywhere; }
.bot-ava { width: 32px; height: 32px; flex: none; border-radius: 10px; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.bot-ava svg.i { width: 17px; height: 17px; }
.answer { flex: 1; min-width: 0; max-width: 94%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 12px 14px; }
.answer.sys { background: transparent; border-style: dashed; }
.answer-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; color: var(--ink-3); }
.md { font-size: 14px; overflow-wrap: anywhere; }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md ol, .md ul { margin: 4px 0 8px; padding-left: 21px; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--ink-3); }
.md .md-h { font-weight: 600; margin-top: 6px; }
.md table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0 10px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); font-weight: 600; }
.answer-src { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.answer-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
details.orig { margin-top: 8px; font-size: 13px; }
details.orig summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
details.orig .md { margin-top: 6px; padding: 8px 10px; border-left: 2px solid var(--line-2); font-size: 13px; color: var(--ink-2); }
.chat-input { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 8px; align-items: flex-end; }
.chat-input .textarea { min-height: 44px; max-height: 150px; resize: none; }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px 0; }
.thinking { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-3); font-size: 13px; }
.thinking::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brass); animation: pulse 1.1s ease-in-out infinite; }
.streaming::after { content: "▍"; color: var(--brass); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 50% { opacity: .25; transform: scale(.8); } }

/* ---------- Tickets ---------- */
.trow { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 12px; padding: 12px 14px 12px 0; cursor: pointer; background: transparent; border: 0; text-align: left; width: 100%; color: inherit; }
.trow:hover { background: var(--surface-2); }
.trow[aria-current="true"] { background: var(--accent-soft); }
.stripe { border-radius: 0 3px 3px 0; }
.stripe.waiting { background: var(--warn); }
.stripe.progress { background: var(--info); }
.stripe.resolved { background: var(--ok); }
.t-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.t-num { font: 500 12px/1 var(--font-mono); color: var(--ink-3); }
.t-q { margin-top: 5px; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t-meta { margin-top: 4px; font-size: 12px; color: var(--ink-3); }
.thread { display: flex; flex-direction: column; gap: 10px; }
.tmsg { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.tmsg.staff { background: var(--accent-soft); border-color: transparent; }
.tmsg.system { background: transparent; border-style: dashed; color: var(--ink-3); font-size: 12.5px; padding: 6px 10px; }
.tmsg-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; flex-wrap: wrap; }
.tmsg-head b { color: var(--ink); font-weight: 600; }
.tmsg-body { white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
.steps { display: flex; align-items: center; gap: 0; flex-wrap: wrap; row-gap: 6px; }
.step { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.step .sd { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line-2); }
.step.done .sd { background: var(--ok); box-shadow: none; }
.step.cur { color: var(--ink); font-weight: 600; }
.step.cur .sd { background: var(--surface); box-shadow: inset 0 0 0 3px var(--info); }
.step-line { width: 26px; height: 2px; background: var(--line); margin: 0 8px; }
.step-line.done { background: var(--ok); }
.person { display: flex; gap: 10px; align-items: center; }
.person-meta { font-size: 12.5px; color: var(--ink-3); }

/* ---------- KPI & charts ---------- */
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi.attn { box-shadow: inset 3px 0 0 var(--warn); }
.kpi-label { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.kpi-label svg.i { width: 15px; height: 15px; color: var(--ink-3); }
.kpi-value { font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.kpi-sub { font-size: 12px; color: var(--ink-3); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--ink-3); font: 11.5px var(--font-body); font-variant-numeric: tabular-nums; }
.chart .cat { fill: var(--ink-2); font: 12.5px var(--font-body); }
.chart .val { fill: var(--ink); font: 600 12px var(--font-body); font-variant-numeric: tabular-nums; }
.chart .bar { fill: var(--accent); cursor: default; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .bar, .chart .hit:focus + .bar { fill: var(--accent-hover); }
.chart .hit:focus { outline: none; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .1; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .xh { stroke: var(--ink-3); stroke-width: 1; }
.tooltip { position: fixed; z-index: 95; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: var(--shadow-2); max-width: 260px; }
.tooltip b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th, .data-table td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
.data-table th { font-size: 12px; color: var(--ink-3); font-weight: 600; border-top: 0; }
.data-table td.num, .data-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 999px; background: var(--accent-soft); min-width: 60px; }
.meter > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.legend-src { font-size: 12px; color: var(--ink-3); }

/* ---------- Planner ---------- */
.progress-bar { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.progress-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.sem { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; padding: 14px 18px; border-top: 1px solid var(--line); }
.sem:first-child { border-top: 0; }
.sem.now { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
.sem-title { font-weight: 600; font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sem-dates { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.ms { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 6px 0; }
.ms input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
.ms-title { font-size: 14px; }
.ms.done .ms-title { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }
.ms-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.ms-due { font: 500 12px/1.5 var(--font-mono); color: var(--ink-2); white-space: nowrap; text-align: right; }
.ms-due.over { color: var(--danger); }
.ms-due.soon { color: var(--warn); }
.entry { padding: 12px 18px; }
.entry-head { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-3); margin-bottom: 3px; }
.entry-title { font-weight: 600; font-size: 13.5px; }
.entry-text { font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; }

/* ---------- Prompt cards ---------- */
.prompt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 12px; }
.prompt-card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 14px 15px; cursor: pointer; display: flex; flex-direction: column; gap: 7px; color: inherit; }
.prompt-card:hover { border-color: var(--accent); }
.pc-cat { font: 500 10.5px/1 var(--font-mono); color: var(--brass); text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; gap: 8px; }
.pc-title { font-weight: 600; font-size: 14.5px; line-height: 1.35; }
.pc-desc { font-size: 13px; color: var(--ink-2); }
.pc-foot { margin-top: auto; padding-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
.tpl { font: 12.5px/1.65 var(--font-mono); white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; max-height: 260px; overflow: auto; }
.tpl mark { background: var(--brass-soft); color: var(--brass); border-radius: 3px; padding: 0 2px; }

/* ---------- Roadmap ---------- */
.road-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0; }
.road { padding: 16px 18px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.road-head { display: flex; align-items: center; gap: 9px; }
.road-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
.road-title { font-weight: 600; font-size: 14px; line-height: 1.3; }
.road-en { font: 11px/1.3 var(--font-mono); color: var(--ink-3); }
.road p { font-size: 13px; color: var(--ink-2); }
.score-row { display: grid; grid-template-columns: 180px 120px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.score-dots { display: flex; gap: 4px; padding-top: 4px; }
.score-dots i { width: 14px; height: 6px; border-radius: 3px; background: var(--accent-soft); }
.score-dots i.on { background: var(--accent); }

/* ---------- Dropdown, modal, toast ---------- */
.dropdown { position: absolute; right: 0; top: calc(100% + 8px); width: 370px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-2); z-index: 50; overflow: hidden; }
.dd-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13.5px; }
.dd-item { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; padding: 11px 14px; border: 0; border-top: 1px solid var(--line); background: transparent; width: 100%; text-align: left; cursor: pointer; color: inherit; }
.dd-item:first-of-type { border-top: 0; }
.dd-item:hover { background: var(--surface-2); }
.dd-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: transparent; }
.dd-item.unread .dd-dot { background: var(--accent); }
.dd-title { font-size: 13.5px; font-weight: 600; }
.dd-text { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.dd-time { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.modal-overlay { position: fixed; inset: 0; z-index: 60; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 24px; overflow-y: auto; }
.modal { width: min(640px, 100%); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-2); border: 1px solid var(--line); display: flex; flex-direction: column; }
.modal.wide { width: min(880px, 100%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font: 600 19px/1.3 var(--font-display); }
.modal-head .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 99; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 24px); }
.toast { background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--shadow-2); }
.scenario li { margin: 0 0 10px; }
.scenario li b { font-weight: 600; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 12px; font-size: 13.5px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }


/* ---------- Compact rows used across modules ---------- */
.mini { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 18px; }
.mini-title { font-weight: 600; font-size: 14px; line-height: 1.38; color: var(--ink); display: block; }
a.mini-title:hover { color: var(--accent); }
.mini-meta { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.mini-why { font-size: 12px; color: var(--brass); margin-top: 3px; }
.ok-txt { color: var(--ok); }
.ev-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 18px; }
.ev-date { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 48px; height: 52px; border-radius: 9px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.ev-day { font: 600 18px/1 var(--font-mono); }
.ev-mon { font: 500 10.5px/1.5 var(--font-mono); text-transform: uppercase; color: var(--ink-3); letter-spacing: .06em; }
.ev-title { font-weight: 600; font-size: 14px; line-height: 1.38; }
.ev-meta { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.up { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 10px 18px; align-items: start; }
.up-due { font: 500 12px/1.6 var(--font-mono); color: var(--ink-2); }
.up-due.over { color: var(--danger); }
.up-t { font-size: 13.5px; line-height: 1.4; }
.up-k { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.ext-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 18px; color: var(--ink); text-decoration: none; }
a.ext-row:hover { background: var(--surface-2); text-decoration: none; }
.ext-row b { font-weight: 600; font-size: 13.5px; }
.ext-row > svg.i { color: var(--ink-3); width: 16px; height: 16px; }
.lib-filters { display: flex; flex-direction: column; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.lib-row { padding: 14px 18px; }
.lib-note { margin-top: 9px; font-size: 13px; color: var(--ink-2); border-left: 2px solid var(--brass); padding-left: 10px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.select.inline { width: auto; }
.sm-select { min-height: 30px; padding: 3px 28px 3px 9px; font-size: 12.5px; border-radius: 7px; }
.cite-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.slot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 18px; }
.slot-when { font: 500 12px/1.5 var(--font-mono); color: var(--ink-2); }
.slot-topic { font-size: 13.5px; font-weight: 600; line-height: 1.38; margin-top: 2px; }
details.more { border-top: 1px solid var(--line); }
details.more summary { cursor: pointer; padding: 10px 18px; font-size: 13px; color: var(--accent); }
.panel-body + .row-list { border-top: 1px solid var(--line); }
.kb-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 18px; width: 100%; text-align: left; background: transparent; border: 0; cursor: pointer; color: inherit; }
.kb-row:hover { background: var(--surface-2); }
.kb-q { font-weight: 600; font-size: 14px; display: block; line-height: 1.4; }
.kb-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.kb-hint { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 6px; }
.tk-split { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 20px; align-items: start; }
.tk-list-col { position: sticky; top: calc(var(--topbar-h) + 16px); }
.tk-list { max-height: calc(100vh - var(--topbar-h) - 230px); min-height: 240px; overflow-y: auto; }
.mobile-only { display: none; }
.res-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 18px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line); align-items: center; }
.inline-form .input { flex: 1; min-width: 160px; width: auto; }
.inline-form.col-form { flex-direction: column; align-items: stretch; }
.inline-form.col-form .textarea { min-height: 64px; }
button.tag { border: 0; cursor: pointer; font-family: inherit; }
button.tag:hover { filter: brightness(.96); }
.chart .xh { opacity: 0; pointer-events: none; }
.chart .hit:hover + .xh, .chart .hit:focus + .xh { opacity: 1; }
.suggest { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; }
.suggest .chip-btn { flex: none; white-space: nowrap; }
.kpi .progress-bar { margin: 4px 0 2px; }
@media (max-width: 1100px) { .tk-split { grid-template-columns: 330px minmax(0, 1fr); } }
@media (max-width: 860px) {
  .tk-split { grid-template-columns: minmax(0, 1fr); }
  .tk-list-col { position: static; }
  .tk-split.show-detail .tk-list-col { display: none; }
  .tk-split:not(.show-detail) .tk-detail-col { display: none; }
  .tk-list { max-height: none; }
  .mobile-only { display: inline-flex; margin-bottom: 6px; }
}

@media (max-width: 1560px) { .who-text { display: none; } }
.topbar.t-chips .sys-chip .lbl { display: none; }
.topbar.t-chips .sys-chip { padding: 4px 8px; }
.topbar.t-roles .role-switch .lbl-long { display: none; }
.topbar.t-roles .role-switch .lbl-short { display: inline; }
.topbar.t-sub .brand-sub { display: none; }
.topbar.t-flag .demo-flag { display: none; }
.topbar.t-nochip .sys-chip { display: none; }
@media (max-width: 1120px) { .role-switch .lbl-long { display: none; } .role-switch .lbl-short { display: inline; } }
@media (max-width: 1320px) { .sys-chip .lbl { display: none; } .sys-chip { padding: 4px 8px; } }
@media (max-width: 1180px) {
  .split, .split.left-fixed { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 980px) {
  .sys-chip .lbl, .who-text { display: none; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar { position: static; height: auto; flex-wrap: wrap; padding: 10px 12px; gap: 10px; }
  .brand-sub { display: none; }
  .role-switch { order: 5; width: 100%; }
  .role-switch button { flex: 1; justify-content: center; padding: 7px 8px; font-size: 13px; }
  .nav { position: sticky; top: 0; z-index: 25; flex-direction: row; overflow-x: auto; max-height: none; min-height: 0; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); gap: 4px; }
  .nav-title, .nav-sep, .ni-en { display: none; }
  .nav-item { width: auto; flex: none; padding: 7px 11px; font-size: 13.5px; white-space: nowrap; }
  .nav-foot { margin: 0; padding: 0; border: 0; flex-direction: row; }
  .main { padding: 18px 14px 56px; }
  .page-head h1 { font-size: 24px; }
  .split.half, .form-grid { grid-template-columns: minmax(0, 1fr); }
  .sem { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .score-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .chat { height: 72vh; }
}
@media (max-width: 520px) {
  .lbl-long { display: none; }
  .lbl-short { display: inline; }
  .top-right .sys-chip { display: none; }
  .role-switch button { min-width: 0; }
  .note-hint { flex-wrap: wrap; }
  .note-hint .note-text { flex-basis: calc(100% - 30px); }
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .result { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .r-meta-col { display: flex; gap: 10px; align-items: baseline; }
  .r-type { margin-top: 0; }
  .pp-row { grid-template-columns: minmax(0, 1fr) 30px; }
  .pp-k { grid-column: 1 / -1; }
  .msg.user .bubble, .answer { max-width: 100%; }
}

body { font: 500 14.5px/1.55 var(--font-body); }
b, strong { font-weight: 800; }
.btn, .seg button, .chip-btn, .role-switch button { font-weight: 700; }
.panel-head h2, .kpi-value, .brand-name, .page-head h1, .modal h2, .sem-title, .road-title { font-family: var(--font-display); }
.page-head h1 { font-weight: 600; font-size: 31px; letter-spacing: -.015em; }
.panel-head h2 { font-weight: 500; font-size: 16px; display: flex; align-items: center; gap: 9px; }
.panel-head h2::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--accent); flex: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.kpi-value { font-weight: 600; }
.eyebrow { color: var(--accent); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }

/* Фон рабочей области: мягкое свечение цвета раздела и тонкая сетка */
.main {
  background:
    radial-gradient(ellipse 55% 38% at 100% 0, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
    radial-gradient(ellipse 40% 30% at 0 100%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%),
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 32px 32px,
    var(--paper);
  transition: background-color .3s;
}

/* Шапка раздела: цветная карточка с иконкой и мотивом */
.page-head.hero {
  position: relative; overflow: hidden; isolation: isolate; align-items: center;
  padding: 22px 24px; border-radius: 22px;
  background: linear-gradient(120deg, color-mix(in srgb, var(--accent-soft) 92%, var(--surface)), var(--surface) 72%);
  border: 1px solid color-mix(in srgb, var(--accent) 18%, var(--line));
  box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 10%, transparent);
}
.hero-motif {
  position: absolute; inset: 0 0 0 38%; z-index: -1; pointer-events: none; background: var(--accent); opacity: .16;
  -webkit-mask: var(--motif) repeat, linear-gradient(90deg, transparent, #000 55%); -webkit-mask-composite: source-in;
  mask: var(--motif) repeat, linear-gradient(90deg, transparent, #000 55%); mask-composite: intersect;
}
.hero-main { display: flex; gap: 18px; align-items: center; min-width: 0; flex: 1 1 420px; }
.hero-ic {
  width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; flex: none; color: #fff;
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 72%, #fff), var(--accent) 55%, var(--press));
  box-shadow: 0 4px 0 var(--press), 0 12px 24px color-mix(in srgb, var(--accent) 35%, transparent);
}
:root[data-theme="dark"] .hero-ic { color: #0C111C; }
.hero-ic svg.i { width: 28px; height: 28px; stroke-width: 1.9; }
.hero-text { min-width: 0; }
.page-head.hero .lede { color: var(--ink-2); }

/* Кнопки с «нажатием», как в CHEMLAB */
.btn { border-radius: 11px; transition: transform .1s, box-shadow .1s, background .15s, filter .15s; }
.btn.primary { box-shadow: 0 3px 0 var(--press); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--press); }
.btn:not(.primary):not(.ghost):not(.ai):not(.is-on) { box-shadow: 0 2px 0 var(--line); }
.btn:not(.primary):active { transform: translateY(1px); }
.btn.ai { background: linear-gradient(135deg, var(--brass-soft), color-mix(in srgb, var(--brass-soft) 60%, var(--accent-soft))); }

/* Панели и показатели */
.panel { border-radius: var(--r); box-shadow: 0 1px 2px rgba(17, 26, 46, .04), 0 8px 24px rgba(17, 26, 46, .05); }
:root[data-theme="dark"] .panel { box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.kpi { border-radius: var(--r); position: relative; overflow: hidden; --k: var(--accent); }
.kpis > .kpi:nth-child(4n+1) { --k: var(--accent); }
.kpis > .kpi:nth-child(4n+2) { --k: var(--s-search); }
.kpis > .kpi:nth-child(4n+3) { --k: var(--s-topics); }
.kpis > .kpi:nth-child(4n+4) { --k: var(--s-prompts); }
.kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--k); opacity: .85; }
.kpi-label svg.i { width: 26px; height: 26px; padding: 5px; border-radius: 8px; color: var(--k); background: color-mix(in srgb, var(--k) 13%, transparent); }
.kpi.attn { box-shadow: inset 3px 0 0 var(--s-todo); }
